include {{source}}

# =========================
# FONT
# =========================
font_family      {{terminal_font}}
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        {{terminal_size}}

# For a thicker font, select a heavier face with font_family above.

background_opacity {{terminal_opacity}}

# =========================
# COLORS — Minimal Dark
# =========================
foreground #{{text}}
background #{{base}}

selection_foreground #{{base}}
selection_background #{{blue}}

cursor #{{rosewater}}

# Normal colors
color0  #{{surface1}}
color1  #{{red}}
color2  #{{green}}
color3  #{{yellow}}
color4  #{{blue}}
color5  #{{pink}}
color6  #{{teal}}
color7  #{{subtext1}}

# Bright colors
color8  #{{surface2}}
color9  #{{red}}
color10 #{{green}}
color11 #{{yellow}}
color12 #{{blue}}
color13 #{{pink}}
color14 #{{teal}}
color15 #{{subtext0}}

active_tab_foreground   #{{base}}
active_tab_background   #{{blue}}
inactive_tab_foreground #{{subtext1}}
inactive_tab_background #{{surface0}}
