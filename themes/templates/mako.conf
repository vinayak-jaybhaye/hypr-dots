include={{source}}
# Colors (Catppuccin Mocha uses 90% opacity for glassmorphism)
border-size={{border_width}}
border-radius={{rounding}}
font={{ui_font}} {{notification_font_size}}
background-color=#{{base}}e6
text-color=#{{text}}ff
border-color=#{{mauve}}ff
progress-color=over #{{surface0}}ff

[urgency=low]
border-color=#{{surface0}}ff
text-color=#{{subtext0}}ff

[urgency=normal]
border-color=#{{blue}}ff

[urgency=high]
border-color=#{{red}}ff
text-color=#{{red}}ff
