general {
  hide_cursor = true
}

background {
  path = $theme_image
  blur_passes = 0
  blur_size = 0
}

# Time
label {
  text = $TIME
  color = $theme_label
  font_family = $theme_font
  font_size = 72
  position = 0, 140
  halign = center
  valign = center
}

# Date
label {
  color = $theme_label
  text = cmd[update:60000] date "+%A, %d %B %Y"
  font_family = $theme_font
  font_size = 24
  position = 0, 60
  halign = center
  valign = center
}

# Username
label {
  monitor =
  text = $USER
  font_size = 16
  color = $theme_text

  position = 0, -140
  halign = center
  valign = center
}

# Password input box
input-field {
  monitor =
  size = 320, 54
  position = 0, -80

  placeholder_text = password

  font_color = $theme_input
  font_family = $theme_font

  dots_center   = true
  fade_on_empty = true 

  # remove box / border completely
  inner_color   = rgba(0,0,0,0.0)
  outer_color   = rgba(0,0,0,0.0)
  outline_thickness = 0
  rounding = 0
}
