# #######################################################################################
# HYPRIDLE — Idle timeout manager
# #######################################################################################
# Manages automatic actions after user inactivity.
# Listeners trigger in sequence based on timeout values.
# All timeouts are in seconds.
# #######################################################################################

general {
  lock_cmd = pidof hyprlock || hyprlock
}

# Lock screen after 5 minutes of inactivity
listener {
  timeout = 300        # 5 min
  on-timeout = pidof hyprlock || hyprlock
}

# Turn off display and keyboard backlight after 10 minutes
listener {
  timeout = 600        # 10 min
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})' && brightnessctl -d '*::kbd_backlight' set 0
  on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend system after 11 minutes
# NOTE: Suspend follows DPMS off by one minute.
# Increase this value to delay suspend after screen-off.
listener {
  timeout = 660        # 11 min
  on-timeout = systemctl suspend
}

